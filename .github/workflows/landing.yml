name: Publish landing to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/landing/**'
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: ./node_modules/.bin/nx build landing
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/landing

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
